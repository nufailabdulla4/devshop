<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Listing</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f4; }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.2s;
        }
        .product-card:hover { transform: translateY(-5px); }
        .product-image {
            width: 100%;
            height: 200px;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
        }
        .product-info { padding: 15px; }
        .product-title { margin: 0 0 10px; font-size: 1.1em; }
        .product-price { color: #27ae60; font-weight: bold; font-size: 1.2em; }
        .btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn:hover { background: #0056b3; }
    </style>
</head>
<body>

<h1>New Arrivals</h1>

<div class="product-grid">
    <!-- Product 1 -->
    <div class="product-card">
        <div class="product-image">Image 1</div>
        <div class="product-info">
            <h3 class="product-title">Wireless Headphones</h3>
            <p class="product-price">$125.00</p>
            <button class="btn">Add to Cart</button>
        </div>
    </div>

    <!-- Product 2 -->
    <div class="product-card">
        <div class="product-image">Image 2</div>
        <div class="product-info">
            <h3 class="product-title">Smart Watch</h3>
            <p class="product-price">$199.99</p>
            <button class="btn">Add to Cart</button>
        </div>
    </div>

    <!-- Product 3 -->
    <div class="product-card">
        <div class="product-image">Image 3</div>
        <div class="product-info">
            <h3 class="product-title">Running Shoes</h3>
            <p class="product-price">$89.50</p>
            <button class="btn">Add to Cart</button>
        </div>
    </div>
</div>

</body>
</html>
